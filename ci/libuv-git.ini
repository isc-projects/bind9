# The libuv-git jobs install libuv git into the source tree.  /opt/tsan in the
# tsan images also has a libuv release, so list libuv git first in
# pkg_config_path and pass its include directory with the compiler, ahead of
# the -I/opt/tsan/include added by liburcu and OpenSSL.

[binaries]
c = ['gcc', '-I@GLOBAL_SOURCE_ROOT@/libuv/include']

[built-in options]
pkg_config_path = ['@GLOBAL_SOURCE_ROOT@/libuv/lib/pkgconfig', '/opt/tsan/lib/pkgconfig']
