# Configuration for the scan-build static analysis job.
#
# Unlike every other file here this one is NOT layered on top of ci/common.ini
# and therefore repeats its contents.  scan-build injects its analyzer wrapper
# by setting $CC (via --use-cc), and a machine file's [binaries] c section takes
# precedence over $CC.  Pulling in ci/common.ini would pin the compiler back to
# gcc and leave the analyzer wrapper unused, so this file deliberately declares
# no [binaries] section at all.
#
#   scan-build --use-cc=clang --exclude build \
#       meson setup --native-file ci/scan-build.ini build

[built-in options]
c_args = ['-fno-omit-frame-pointer', '-fno-optimize-sibling-calls']
libdir = 'lib'
optimization = '1'

[project options]
cmocka = 'enabled'
developer = 'enabled'
leak-detection = 'enabled'
idn = 'enabled'
# scan-build analyzes the compiler invocations, so LTO would only slow it down.
named-lto = 'disabled'
