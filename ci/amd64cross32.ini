[binaries]
c = 'i686-linux-gnu-gcc'
ar = 'i686-linux-gnu-ar'
nm = 'i686-linux-gnu-nm'
pkgconfig = 'i686-linux-gnu-pkg-config'

[host_machine]
system = 'linux'
cpu_family = 'x86'
cpu = 'x86'
endian = 'little'

[properties]
needs_exe_wrapper = false

[built-in options]
c_args = ['-fno-omit-frame-pointer', '-fno-optimize-sibling-calls']
optimization = '1'

[project options]
cmocka = 'enabled'
developer = 'enabled'
leak-detection = 'enabled'
named-lto = 'thin'
idn = 'enabled'
gssapi = 'disabled'
tracing = 'disabled'
line = 'enabled'
