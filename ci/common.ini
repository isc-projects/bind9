# Base configuration shared by every CI build.  The `.configure` job template
# always layers this file first; per-job overlays add their delta on top:
#   meson setup --native-file ci/common.ini --native-file ci/<job>.ini build
#
# These options live here rather than on the `meson setup` command line because
# a command-line -D outranks every machine file, so it would silently override
# an overlay that tries to change one of them.  `cflags_common` is exported as a
# constant so an overlay can extend it, e.g. c_args = cflags_common + ['-DDEBUG'].

[constants]
cflags_common = ['-fno-omit-frame-pointer', '-fno-optimize-sibling-calls']

[binaries]
c = 'gcc'

[built-in options]
c_args = cflags_common
libdir = 'lib'
optimization = '1'

[project options]
cmocka = 'enabled'
developer = 'enabled'
leak-detection = 'enabled'
named-lto = 'thin'
