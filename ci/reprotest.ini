# Machine file for the reproducible-build job.  Not layered on ci/common.ini:
# `meson reprotest` builds twice and compares byte for byte, so it configures
# the smallest build that still exercises the compiler.

[binaries]
c = 'gcc'

[built-in options]
c_args = ['-fno-omit-frame-pointer', '-fno-optimize-sibling-calls']
