variables:
  # The default timeout is 60 minutes. Set RUNNER_SCRIPT_TIMEOUT to 55m to
  # leave room for the after_script timeout that defaults to 5m.
  RUNNER_SCRIPT_TIMEOUT: 55m
  # Not normally needed, but may be if some script uses `apt-get install`.
  DEBIAN_FRONTEND: noninteractive
  # Locale settings do not affect the build, but might affect tests.
  LC_ALL: C

  # automated commits will inherit identification from pipeline trigger
  GIT_AUTHOR_NAME: "$GITLAB_USER_NAME (GitLab job $CI_JOB_ID)"
  GIT_AUTHOR_EMAIL: "$GITLAB_USER_EMAIL"
  GIT_COMMITTER_NAME: "$GIT_AUTHOR_NAME"
  GIT_COMMITTER_EMAIL: "$GIT_AUTHOR_EMAIL"

  CI_REGISTRY_IMAGE: registry.gitlab.isc.org/isc-projects/images/bind9
  SOFTHSM2_CONF: "/var/tmp/softhsm2/softhsm2.conf"

  # VirtualBox driver needs to set build_dir to "/builds" in gitlab-runner.toml
  KYUA_RESULT: "$CI_PROJECT_DIR/kyua.results"

  GIT_DEPTH: 1
  GIT_CLEAN_FLAGS: -ffdxq

  # The following values may be overwritten in GitLab's CI/CD Variables Settings.
  BUILD_PARALLEL_JOBS: 6
  TEST_PARALLEL_JOBS: 4

  CONFIGURE: ./configure
  CLANG_VERSION: 23
  CLANG: "clang-${CLANG_VERSION}"
  LLVM_SYMBOLIZER: "/usr/lib/llvm-${CLANG_VERSION}/bin/llvm-symbolizer"
  ASAN_SYMBOLIZER_PATH: "/usr/lib/llvm-${CLANG_VERSION}/bin/llvm-symbolizer"

  CFLAGS_COMMON: -fno-omit-frame-pointer -fno-optimize-sibling-calls -O1 -g -Wall -Wextra

  # Pass run-time flags to AddressSanitizer to get core dumps on error.
  ASAN_OPTIONS: abort_on_error=1:disable_coredump=0:unmap_shadow_on_exit=1

  UBSAN_OPTIONS: "halt_on_error=1:abort_on_error=1:disable_coredump=0"

  INSTALL_PATH: "${CI_PROJECT_DIR}/.local"

  # Disable pytest's "cacheprovider" plugin to prevent it from creating
  # cross-testrun files as there is no need to use that feature in CI.
  PYTEST_ADDOPTS: "-p no:cacheprovider"

default:
  # Allow all running CI jobs to be automatically canceled when a new
  # version of a branch is pushed.
  #
  # See: https://docs.gitlab.com/ee/ci/pipelines/settings.html#auto-cancel-redundant-pipelines
  interruptible: true

  # AWS can interrupt the spot instance anytime, so let's retry the job when
  # the interruption event happens to avoid a pipeline failure.
  retry:
    max: 2
    when:
      - runner_system_failure

workflow:
  # Prevent jobs marked with "interruptible: false" that have not yet been
  # started from getting canceled when a newer pipeline is created for the same
  # branch.  This setting was added to enable "iterative autorebases" to work
  # correctly with `resource_group`.  Without this setting, pending rebase jobs
  # waiting for a resource group would get canceled by the "git push" operation
  # at the end of a prior rebase job belonging to the same resource group.
  auto_cancel:
    on_new_commit: interruptible

stages:
  - quick-checks
  - other-checks
  - build
  - unit
  - system
  - performance
  - docs
  - postmerge
  - release

### Runner Tag Templates

# Autoscaling GitLab Runner on AWS EC2 (amd64)

.linux-amd64: &linux_amd64
  tags:
    - linux
    - aws
    - runner-manager
    - amd64

### Docker Image Templates

# Alpine Linux

.alpine-3.20-amd64: &alpine_3_20_amd64_image
  image: "$CI_REGISTRY_IMAGE:alpine-3.20-amd64"
  <<: *linux_amd64

# AlmaLinux

.almalinux-8-amd64: &almalinux_8_amd64_image
  image: "$CI_REGISTRY_IMAGE:almalinux-8-amd64"
  <<: *linux_amd64

.almalinux-9-amd64: &almalinux_9_amd64_image
  image: "$CI_REGISTRY_IMAGE:almalinux-9-amd64"
  <<: *linux_amd64

# Debian

.debian-bookworm-amd64: &debian_bookworm_amd64_image
  image: "$CI_REGISTRY_IMAGE:debian-bookworm-amd64"
  <<: *linux_amd64

.debian-trixie-amd64: &debian_trixie_amd64_image
  image: "$CI_REGISTRY_IMAGE:debian-trixie-amd64"
  <<: *linux_amd64

.debian-trixie-amd64cross32: &debian_trixie_amd64cross32_image
  image: "$CI_REGISTRY_IMAGE:debian-trixie-amd64cross32"
  <<: *linux_amd64

# Fedora

.fedora-40-amd64: &fedora_40_amd64_image
  image: "$CI_REGISTRY_IMAGE:fedora-40-amd64"
  <<: *linux_amd64

# Ubuntu

.ubuntu-jammy-amd64: &ubuntu_jammy_amd64_image
  image: "$CI_REGISTRY_IMAGE:ubuntu-jammy-amd64"
  <<: *linux_amd64

.ubuntu-noble-amd64: &ubuntu_noble_amd64_image
  image: "$CI_REGISTRY_IMAGE:ubuntu-noble-amd64"
  <<: *linux_amd64

# Base image
# This is a meta image that is used as a base for non-specific jobs

.base: &base_image
  <<: *debian_trixie_amd64_image

### Job Templates

.rule_mr_code: &rule_mr_code
  - if: '$CI_MERGE_REQUEST_DIFF_BASE_SHA != null'
    changes:
      - '**/*.c'
      - '**/*.h'
      - '**/meson.build'

.rule_mr_shell: &rule_mr_shell
  - if: '$CI_MERGE_REQUEST_DIFF_BASE_SHA != null'
    changes:
      - '**/*.sh'
      - '**/*.sh.in'
      - 'bin/tests/system/org.isc.bind.system'

.rule_mr_python: &rule_mr_python
  - if: '$CI_MERGE_REQUEST_DIFF_BASE_SHA != null'
    changes:
      - '**/*.py'

.rule_mr_manual: &rule_mr_manual
  - if: '$CI_MERGE_REQUEST_DIFF_BASE_SHA != null'
    when: manual  # only run on MR if requested
    allow_failure: true  # don't block the pipeline or the pipeline result

.rule_tag: &rule_tag
  - if: '$CI_PROJECT_NAMESPACE == "isc-private" && $CI_COMMIT_TAG != null'

.rule_source_other_than_mr: &rule_source_other_than_mr
  - if: '$CI_PIPELINE_SOURCE =~ /^(api|pipeline|schedule|trigger|web)$/ && $REBASE_ONLY != "1"'

.rule_source_all: &rule_source_all
  - if: '$CI_PIPELINE_SOURCE =~ /^(api|merge_request_event|pipeline|schedule|trigger|web)$/ && $REBASE_ONLY != "1"'

.rule_branch_after_autorebase: &rule_branch_after_autorebase
  - if: '$CI_PIPELINE_SOURCE == "push" && $AUTOREBASED == "1"'

.api-pipelines-schedules-tags-triggers-web-triggering-rules: &api_pipelines_schedules_tags_triggers_web_triggering_rules
  rules:
    - *rule_tag
    - *rule_source_other_than_mr

.default-triggering-rules_list: &default_triggering_rules_list
  - *rule_tag
  - *rule_source_all
  - *rule_branch_after_autorebase

.default-triggering-rules: &default_triggering_rules
  rules:
    - *default_triggering_rules_list

.code-triggering-rules: &code_triggering_rules
  rules:
    - *rule_mr_code
    - *rule_mr_manual
    - *rule_tag
    - *rule_source_other_than_mr
    - *rule_branch_after_autorebase

.shell-triggering-rules: &shell_triggering_rules
  rules:
    - *rule_mr_shell
    - *rule_mr_manual
    - *rule_tag
    - *rule_source_other_than_mr
    - *rule_branch_after_autorebase

.python-triggering-rules: &python_triggering_rules
  rules:
    - *rule_mr_python
    - *rule_mr_manual
    - *rule_tag
    - *rule_source_other_than_mr
    - *rule_branch_after_autorebase

.quick-check: &quick_checks_job
  <<: *default_triggering_rules
  <<: *base_image
  stage: quick-checks
  needs: []
  tags:
    - smalljob

.other-check: &other_checks_job
  <<: *default_triggering_rules
  <<: *base_image
  stage: other-checks
  needs: []

.configure: &configure
    - ${CONFIGURE}
      --disable-maintainer-mode
      --enable-developer
      --with-libtool
      --disable-static
      --enable-option-checking=fatal
      --enable-dnstap
      --with-cmocka
      --with-libxml2
      --with-json-c
      --without-make-clean
      --without-python
      $EXTRA_CONFIGURE
      || (test -s config.log && cat config.log; exit 1)

.git-clone-bind9-qa: &git_clone_bind9-qa
  - git clone --depth 1 https://gitlab.isc.org/isc-projects/bind9-qa.git "$CI_PROJECT_DIR"/bind9-qa

.build: &build_job
  <<: *default_triggering_rules
  stage: build
  before_script:
    - test -n "${OOT_BUILD_WORKSPACE}" && mkdir "${OOT_BUILD_WORKSPACE}" && cd "${OOT_BUILD_WORKSPACE}"
  script:
    - *configure
    - test -n "${SKIP_MAKE_DEPEND}" || make -j${BUILD_PARALLEL_JOBS:-1} depend 2>&1 | tee make-depend.log
    - test -n "${SKIP_MAKE_DEPEND}" || ( ! grep -F "error:" make-depend.log )
    - make -j${BUILD_PARALLEL_JOBS:-1} -k all V=1
    - test -z "${RUN_MAKE_INSTALL}" || make DESTDIR="${INSTALL_PATH}" install
    - test -z "${RUN_MAKE_INSTALL}" || DESTDIR="${INSTALL_PATH}" sh util/check-make-install
    - if [[ "${CFLAGS}" == *"-fsanitize=address"* ]]; then ( ! grep -F AddressSanitizer config.log ); fi
    - test -z "${CROSS_COMPILATION}" || grep -F -A 1 "checking whether we are cross compiling" config.log | grep -q "result.*yes"
    - test -z "${CROSS_COMPILATION}" || file lib/dns/gen | grep -F -q "ELF 64-bit LSB"
    - test -z "${CROSS_COMPILATION}" || ( ! git ls-files -z --others --exclude lib/dns/gen | xargs -0 file | grep "ELF 64-bit LSB" )
  artifacts:
    untracked: true
    when: always
  needs: []

.setup_interfaces: &setup_interfaces
    - if [ "$(id -u)" -eq "0" ]; then
        sh -x bin/tests/system/ifconfig.sh up;
      else
        sudo sh -x bin/tests/system/ifconfig.sh up;
      fi

.setup_softhsm: &setup_softhsm
    - export SLOT=$(sh -x bin/tests/prepare-softhsm2.sh)
    - test -n "${SLOT}" && test "${SLOT}" -gt 0

.system_test_common: &system_test_common
  <<: *default_triggering_rules
  stage: system
  before_script:
    - *setup_interfaces
    - *setup_softhsm
  script:
    - ( cd bin/tests/system && make -j${TEST_PARALLEL_JOBS:-1} -k test V=1 )
    - test -s bin/tests/system/systests.output
    - if git rev-parse > /dev/null 2>&1; then ( ! grep "^I:.*:file.*not removed$" bin/tests/system/systests.output ); fi
    - '( ! grep -F "grep: warning:" bin/tests/system/systests.output )'
    # Run the tests not listed in conf.sh.
    - PYTEST="$(cd bin/tests/system && . ./conf.sh && echo "$PYTEST")"
    - test -n "${SKIP_PYTEST_RUNNER}" || ( cd bin/tests/system && "$PYTEST" -n "${TEST_PARALLEL_JOBS:-1}" )

.system_test: &system_test_job
  <<: *system_test_common
  artifacts:
    untracked: true
    when: on_failure

.system_test_gcov: &system_test_gcov_job
  <<: *system_test_common
  artifacts:
    untracked: true
    when: always

.kyua_report: &kyua_report_html
  - kyua --logfile /dev/null report-html
         --force
         --results-file "$KYUA_RESULT"
         --results-filter ""
         --output kyua_html > /dev/null

.unit_test_common: &unit_test_common
  <<: *default_triggering_rules
  stage: unit
  before_script:
    - *setup_softhsm
  script:
    - make unit
  after_script:
    - *kyua_report_html

.unit_test: &unit_test_job
  <<: *unit_test_common
  artifacts:
    untracked: true
    when: on_failure

.unit_test_gcov: &unit_test_gcov_job
  <<: *unit_test_common
  artifacts:
    untracked: true
    when: always

.respdiff: &respdiff_job
  <<: *code_triggering_rules
  stage: system
  before_script:
    - *configure
    - make -j${BUILD_PARALLEL_JOBS:-1} V=1
    - *setup_interfaces
    - *git_clone_bind9-qa
    - cd "$CI_PROJECT_DIR"/bind9-qa/respdiff
  after_script:
    - cd "$CI_PROJECT_DIR"/bind9-qa/respdiff
    - if [ ! -e rspworkdir/report.json ]; then respdiff/msgdiff.py --config rspworkdir/respdiff.cfg rspworkdir; fi
    - if [ ! -e rspworkdir/report.txt ]; then respdiff/diffsum.py --config rspworkdir/respdiff.cfg --limit 0 rspworkdir | tee rspworkdir/report.txt; fi
  needs: []
  artifacts:
    paths:
      - bind9-qa/respdiff
    exclude:
      - bind9-qa/respdiff/rspworkdir/data.mdb # Exclude a 10 GB file.
    untracked: true
    when: always

### Job Definitions

# Jobs in the quick-checks stage

misc:
  <<: *quick_checks_job
  script:
    - sh util/check-ans-prereq.sh
    - xmllint --noout --nonet `git ls-files '*.xml' '*.docbook'`
    - sh util/check-categories.sh
    - sh util/xmllint-html.sh
  artifacts:
    when: on_failure

changes:
  <<: *quick_checks_job
  script:
    - sh util/tabify-changes < CHANGES > CHANGES.tmp
    - diff -urNap CHANGES CHANGES.tmp
    - perl util/check-changes CHANGES
    - sh util/check-line-length.sh CHANGES
    - rm CHANGES.tmp

black:
  <<: *quick_checks_job
  <<: *python_triggering_rules
  # Do not follow black updates in the base image so we don't have to change
  # Python script formatting.
  before_script:
    - pip3 install black==25.12.0
  script:
    - black $(git ls-files '*.py' '*.py.in')
    - git diff > black.patch
    - if test "$(git status --porcelain | grep -Ev '\?\?' | wc -l)" -gt "0"; then git status --short; exit 1; fi
  artifacts:
    paths:
      - black.patch
    expire_in: "1 week"
    when: on_failure

ci-orphaned-anchors:
  <<: *quick_checks_job
  script:
    - *git_clone_bind9-qa
    - >
      "$CI_PROJECT_DIR"/bind9-qa/ci-orphaned-anchors/check_orphaned_anchors_ci.py .gitlab-ci.yml
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - .gitlab-ci.yml

pylint:
  <<: *quick_checks_job
  <<: *python_triggering_rules
  script:
    - *configure
    - export PYTHONPATH="$PYTHONPATH:$CI_PROJECT_DIR/bin/python"
    - pylint --rcfile $CI_PROJECT_DIR/.pylintrc $(git ls-files '*.py' | grep -vE '(ans\.py|dangerfile\.py|^bin/tests/system/|^contrib/)')
      # Ignore Pylint wrong-import-position error in system test to enable use of pytest.importorskip
    - pylint --rcfile $CI_PROJECT_DIR/.pylintrc --disable=wrong-import-position $(git ls-files 'bin/tests/system/*.py' | grep -vE 'ans\.py')

reuse:
  <<: *quick_checks_job
  image:
    name: docker.io/fsfe/reuse:5.0
    entrypoint: [""]
  script:
    - reuse lint

shfmt:
  <<: *quick_checks_job
  <<: *shell_triggering_rules
  script:
    - shfmt -w -i 2 -ci -bn bin/tests/system/ util/ $(find bin/tests/system/ -name "*.sh.in")
    - git diff > shfmt.patch
    - if test "$(git status --porcelain | grep -Ev '\?\?' | wc -l)" -gt "0"; then git status --short; exit 1; fi
  artifacts:
    paths:
      - shfmt.patch
    expire_in: "1 week"
    when: on_failure

danger:
  <<: *quick_checks_job
  environment:
    name: danger
    action: access
  script:
    - pip install git+https://gitlab.isc.org/isc-projects/hazard.git
    - hazard
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# Jobs in the other-checks stage

checkbashisms:
  <<: *other_checks_job
  <<: *shell_triggering_rules
  script:
    - checkbashisms $(find . -path './.git' -prune -o -type f -exec sh -c 'head -n 1 "{}" | grep -qsF "#!/bin/sh"' \; -print | sed -e '/^\.\/install-sh$/d')

coccinelle:
  <<: *other_checks_job
  rules:
    - if: '$CI_MERGE_REQUEST_DIFF_BASE_SHA != null'
      changes:
        - '**/*.c'
        - '**/*.h'
        - 'cocci/**'
    - *rule_mr_manual
    - *rule_tag
    - *rule_source_other_than_mr
    - *rule_branch_after_autorebase
  script:
    - util/check-cocci
    - if test "$(git status --porcelain | grep -Ev '\?\?' | wc -l)" -gt "0"; then git status --short; exit 1; fi

tarball-create:
  <<: *build_job
  <<: *base_image
  script:
    - source version
    - export BIND9_VERSION="${MAJORVER}.${MINORVER}${PATCHVER:+.}${PATCHVER}${RELEASETYPE}${RELEASEVER}${EXTENSIONS}"
    - export BIND_DIRECTORY="bind-${BIND9_VERSION}"
    - git archive --prefix="${BIND_DIRECTORY}/" --output="${BIND_DIRECTORY}.tar" HEAD
    - mkdir "${BIND_DIRECTORY}"
    - echo "SRCID=$(git rev-list --max-count=1 HEAD | cut -b1-7)" > "${BIND_DIRECTORY}/srcid"
    - tar --append --file="${BIND_DIRECTORY}.tar" "${BIND_DIRECTORY}/srcid"
    - sphinx-build -b man -d "${BIND_DIRECTORY}/tmp/.doctrees/" -W -a -v -c doc/man/ -D version="@BIND9_VERSION@" -D today="@RELEASE_DATE@" -D release="@BIND9_VERSIONSTRING@" doc/man "${BIND_DIRECTORY}/doc/man"
    - rm -rf "${BIND_DIRECTORY}/tmp/.doctrees/"
    - for man in "${BIND_DIRECTORY}/doc/man/"*; do mv "$man" "$man"in; done
    - tar --append --file="${BIND_DIRECTORY}.tar" "${BIND_DIRECTORY}/doc/man/"*in
    - xz "${BIND_DIRECTORY}.tar"
  artifacts:
    paths:
      - bind-*.tar.xz

# Jobs for doc builds on Debian 13 "trixie" (amd64)

docs:
  <<: *default_triggering_rules
  <<: *base_image
  stage: docs
  before_script:
    - test -n "${OOT_BUILD_WORKSPACE}" && mkdir "${OOT_BUILD_WORKSPACE}" && cd "${OOT_BUILD_WORKSPACE}"
  script:
    - *configure
    - make maintainer-clean
    - autoreconf2.69 -fi
    - *configure
    - make -j${BUILD_PARALLEL_JOBS:-1} all V=1
    - make -j${BUILD_PARALLEL_JOBS:-1} doc V=1
    - if test "$(git status --porcelain | grep -Ev '\?\?' | grep -v -F -e aclocal.m4 -e configure -e ltmain.sh -e bin/named/bind9.xsl.h -e m4/ | wc -l)" -gt "0"; then git status --short; exit 1; fi
    - find doc/man/ -maxdepth 1 -name "*.[0-9]" -exec mandoc -T lint "{}" \; | ( ! grep -v -e "skipping paragraph macro. sp after" -e "unknown font, skipping request. ft C" -e "input text line longer than 80 bytes" )
  artifacts:
    paths:
      - doc/arm/
      - doc/man/
      - doc/misc/
    when: always
  needs: []

# Job detecting named.conf breakage introduced since the previous point release

cross-version-config-tests:
  stage: system
  <<: *base_image
  <<: *default_triggering_rules
  variables:
    CC: gcc
    CFLAGS: "${CFLAGS_COMMON}"
    # Disable option checking to prevent problems with new default options in
    # the &configure anchor.
    EXTRA_CONFIGURE: "--disable-option-checking"
  script:
    # Exclude the dyndb test from the system test as the sample library can't
    # locate the libdns library from the BIND 9 baseline version.
    - sed -i '/^dyndb \\$/d' bin/tests/system/conf.sh.common
    - *configure
    - *setup_interfaces
    - make -j${BUILD_PARALLEL_JOBS:-1}
    - export BIND_BRANCH=16
    # When testing a .0 release, compare it against the previous development
    # release (e.g., 9.19.0 and 9.18.0 should both be compared against 9.17.22).
    - if [ "$(sed -n -E "s|^m4_define\(\[bind_VERSION_PATCH\], ([0-9]+)\)dnl$|\1|p" configure.ac)" = "0" ]; then export BIND_BRANCH=$((BIND_BRANCH - 1 - (BIND_BRANCH % 2))); fi
    - BASELINE="$(curl -s "https://gitlab.isc.org/api/v4/projects/1/repository/tags?search=^v9.${BIND_BRANCH}&order_by=version" | jq -r ".[0].name")"
    - git clone --branch "${BASELINE}" --depth 1 https://gitlab.isc.org/isc-projects/bind9.git "bind-${BASELINE}"
    - cd "bind-${BASELINE}"
    - *configure
    - make -j${BUILD_PARALLEL_JOBS:-1}
    # The cross-version-config-tests job would fail when a system test is
    # removed from the upcoming release. To avoid this, remove the system test
    # also from the $BIND_BASELINE_VERSION.
    - find bin/tests/system/ -mindepth 1 -maxdepth 1 -type d -exec sh -c 'test -e ../"$0" || rm -rfv -- "$0"' {} \;
    - cd bin/tests/system
    # Neutralize shell and pytests; in effect, "nsX" servers are just started
    # and stopped, thus configuration checked.
    - truncate --size=0 */tests{.sh,*.py}
    # Run the setup phase of all system tests in the most recently tagged BIND 9
    # release using the binaries built for the current BIND 9 version.  This
    # intends to detect obvious backward compatibility issues with the latter.
    - sed -i -E "s|(export TOP)=.*|\1=${CI_PROJECT_DIR}|" conf.sh
    - make -j${TEST_PARALLEL_JOBS:-1} -k check V=1
  artifacts:
    paths:
      - bind-*
    untracked: true
    expire_in: "1 day"
    when: on_failure
  needs: []

# Jobs for regular GCC builds on Alpine Linux 3.20 (amd64)

gcc:alpine3.20:amd64:
  variables:
    CC: gcc
    CFLAGS: "${CFLAGS_COMMON}"
    EXTRA_CONFIGURE: "--without-gssapi --with-python"
  <<: *alpine_3_20_amd64_image
  <<: *build_job

system:gcc:alpine3.20:amd64:
  <<: *alpine_3_20_amd64_image
  <<: *system_test_job
  variables:
    # The image is no longer rebuilt and lacks the pytest runner's
    # dependencies.
    SKIP_PYTEST_RUNNER: 1
  needs:
    - job: gcc:alpine3.20:amd64
      artifacts: true

unit:gcc:alpine3.20:amd64:
  <<: *alpine_3_20_amd64_image
  <<: *unit_test_job
  needs:
    - job: gcc:alpine3.20:amd64
      artifacts: true

# Jobs for regular GCC builds on Alma Linux 8 (amd64)

gcc:almalinux8:amd64:
  variables:
    CC: gcc
    CFLAGS: "${CFLAGS_COMMON}"
    EXTRA_CONFIGURE: "--enable-buffer-useinline --with-libidn2 --with-gssapi=krb5-config"
  <<: *almalinux_8_amd64_image
  <<: *build_job

system:gcc:almalinux8:amd64:
  <<: *almalinux_8_amd64_image
  <<: *system_test_job
  needs:
    - job: gcc:almalinux8:amd64
      artifacts: true

unit:gcc:almalinux8:amd64:
  <<: *almalinux_8_amd64_image
  <<: *unit_test_job
  needs:
    - job: gcc:almalinux8:amd64
      artifacts: true

# Jobs for regular GCC builds on Alma Linux 9 (amd64)

gcc:almalinux9:amd64:
  variables:
    CC: gcc
    CFLAGS: "${CFLAGS_COMMON}"
    EXTRA_CONFIGURE: "--with-libidn2"
  <<: *almalinux_9_amd64_image
  <<: *build_job

system:gcc:almalinux9:amd64:
  <<: *almalinux_9_amd64_image
  <<: *system_test_job
  needs:
    - job: gcc:almalinux9:amd64
      artifacts: true

unit:gcc:almalinux9:amd64:
  <<: *almalinux_9_amd64_image
  <<: *unit_test_job
  needs:
    - job: gcc:almalinux9:amd64
      artifacts: true

