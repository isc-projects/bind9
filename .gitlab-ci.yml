# Jobs for regular GCC builds on Alma Linux 8 (amd64)

gcc:almalinux8:amd64:
  variables:
    CC: gcc
    CFLAGS: "${CFLAGS_COMMON}"
    EXTRA_CONFIGURE: "--enable-buffer-useinline --with-libidn2"
